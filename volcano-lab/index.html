<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191817">
  <meta name="description" content="调节岩浆黏度与气体含量，观察火山喷发的不同可能。">
  <title>VOLCANO LAB｜火山实验室</title>
  <link rel="stylesheet" href="styles-v2.css">
  <link rel="stylesheet" href="cinematic-v2.css">
  <script src="../three.min.js" defer></script>
  <script src="js/model.js" defer></script>
  <script src="js/scene.js" defer></script>
  <script src="js/three-scene.js" defer></script>
  <script src="js/observer.js" defer></script>
  <script src="js/story-v2.js" defer></script>
</head>
<body class="journey-page">
  <main class="journey-shell">
    <section id="opening" class="opening" aria-labelledby="opening-title">
      <div class="opening-scene scene-frame"><canvas id="opening-volcano" width="1600" height="900" role="img" aria-label="暖色天空下的火山、山脚聚落和远山三维场景"></canvas><div class="opening-vignette" aria-hidden="true"></div></div>
      <header class="opening-header"><span>VOLCANIC FIELD STUDY · 001</span><span>教学模拟 / 非真实预测</span></header>
      <div class="opening-content"><p class="eyebrow">AN INTERACTIVE VOLCANO STUDY</p><h1 id="opening-title">VOLCANO LAB</h1><p class="opening-cn">火山实验室</p><button id="start-exploring" class="explore-button" type="button">开始探索 <span aria-hidden="true">→</span></button><a class="skip-link" href="lab.html">直接进入实验室</a></div>
      <p id="opening-render-status" class="opening-status" role="status">正在准备完整三维场景…</p>
    </section>
    <section id="cinematic" class="cinematic" hidden aria-label="火山知识介绍">
      <header class="cinematic-header"><a class="brand" href="index.html"><span aria-hidden="true">▲</span> VOLCANO LAB</a><p><span id="tour-label">SCENE TOUR</span><small id="camera-readout">全景环绕</small></p><button id="skip-intro" class="quiet-button" type="button" title="跳过镜头和知识介绍，直接进入实验室">跳过介绍</button></header>
      <div class="cinematic-stage scene-frame"><canvas id="cinematic-volcano" width="1600" height="900" role="img" aria-label="镜头正在围绕火山聚落移动"></canvas><div class="cinematic-vignette" aria-hidden="true"></div><div id="shot-caption" class="shot-caption" aria-live="polite">正在建立全景…</div><span class="scene-disclaimer">程序生成场景 · 非真实比例</span></div>
      <p id="cinematic-status" class="sr-status" role="status">三维场景载入中</p>
      <section id="cg-dialogue" class="cg-dialogue" hidden aria-labelledby="dialogue-title"><div class="speaker"><span aria-hidden="true">VL</span><div><strong>火山观测员</strong><small>FIELD NOTES</small></div></div><div class="dialogue-copy" aria-live="polite" aria-atomic="true"><p id="chapter-tag" class="eyebrow"></p><h2 id="dialogue-title" tabindex="-1"></h2><p id="dialogue-text"></p></div><div class="dialogue-actions"><span id="dialogue-progress">01 / 05</span><button id="skip-lesson" class="quiet-button" type="button" title="跳过余下文字介绍并进入参数实验">跳过介绍</button><button id="continue-dialogue" class="explore-button" type="button">继续 →</button></div></section>
    </section>
    <noscript><p class="noscript">请启用 JavaScript 查看场景与实验。<a href="lab.html">直接进入实验室</a></p></noscript>
  </main>
</body>
</html>
